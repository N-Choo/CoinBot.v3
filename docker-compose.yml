# ──────────────────────────────────────────────
# Dev services  → local DB, hot-reload, debug
# Prod services → cloud DB, pre-built images
#
# make dev   → starts all dev services
# prod services run via the prod profile / deployed images
#
# All container env comes from the root .env via `env_file`; do not add
# `environment:` blocks here. The opencode sandbox uses process/opencode/.env
# so DB/exchange secrets never reach it.
# ──────────────────────────────────────────────

x-service-defaults: &service-defaults
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"


services:
  # ── Shared Infrastructure ──────────────────

  postgres:
    <<: *service-defaults
    mem_limit: 1g
    image: postgres:16-alpine
    env_file:
      - .env
    # No host port: only containers on app-network can reach PostgreSQL.
    # `make dev` adds a 127.0.0.1-only mapping via docker-compose.dev.yml.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  redis:
    <<: *service-defaults
    mem_limit: 512m
    image: redis:7-alpine
    env_file:
      - .env
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    # No host port: only containers on app-network can reach Redis.
    # `make dev` adds a 127.0.0.1-only mapping via docker-compose.dev.yml.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  # ── Deposit Worker ─────────────────────────

  deposit-worker:
    <<: *service-defaults
    profiles:
      - dev
    build:
      context: .
      dockerfile: process/deposit-worker/Dockerfile
      target: dev-builder
    command: cargo run -p deposit
    volumes:
      - .:/app
      - /app/target
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - app-network

  deposit-worker-prod:
    <<: *service-defaults
    cap_drop:
      - ALL
    mem_limit: 512m
    image: ghcr.io/n-choo/coinbot-worker:latest
    build:
      context: .
      dockerfile: process/deposit-worker/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      app-network:
        aliases:
          - deposit-worker
    profiles:
      - prod

  # ── Withdraw Worker ────────────────────────

  withdraw-worker:
    <<: *service-defaults
    profiles:
      - dev
    build:
      context: .
      dockerfile: process/withdraw-worker/Dockerfile
      target: dev-builder
    command: cargo run -p withdraw-worker
    volumes:
      - .:/app
      - /app/target
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - app-network

  withdraw-worker-prod:
    <<: *service-defaults
    cap_drop:
      - ALL
    mem_limit: 512m
    image: ghcr.io/n-choo/coinbot-withdraw-worker:latest
    build:
      context: .
      dockerfile: process/withdraw-worker/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - prod

  # ── API Gateway ────────────────────────────

  api_gateway:
    <<: *service-defaults
    profiles:
      - dev
    build:
      context: .
      dockerfile: process/api_gateway/Dockerfile
      target: dev-builder
    command: cargo run -p api-gateway
    env_file:
      - .env
    ports:
      - "8081:8080"
    volumes:
      - .:/app
      - /app/target
    depends_on:
      - postgres
      - redis
      - deposit-worker
    networks:
      - app-network

  api_gateway-prod:
    <<: *service-defaults
    cap_drop:
      - ALL
    mem_limit: 512m
    image: ghcr.io/n-choo/coinbot-api_gateway:latest
    build:
      context: .
      dockerfile: process/api_gateway/Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      deposit-worker-prod:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - prod

  # ── Frontend ───────────────────────────────

  frontend:
    <<: *service-defaults
    profiles:
      - dev
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./react:/app:Z
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - api_gateway
    networks:
      - app-network

  frontend-prod:
    <<: *service-defaults
    mem_limit: 128m
    image: ghcr.io/n-choo/coinbot-frontend:latest
    build:
      context: ./react
    ports:
      - "80:80"
    depends_on:
      - api_gateway-prod
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - prod

  # ── Trade Engine ───────────────────────────

  trade-engine:
    <<: *service-defaults
    profiles:
      - dev
    build:
      context: .
      dockerfile: process/trade-engine/Dockerfile
      target: dev-builder
    command: cargo run -p trade-engine
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - .:/app
      - /app/target
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - deposit-worker
    networks:
      - app-network

  trade-engine-prod:
    <<: *service-defaults
    cap_drop:
      - ALL
    mem_limit: 1g
    image: ghcr.io/n-choo/coinbot-trade_engine:latest
    build:
      context: .
      dockerfile: process/trade-engine/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      app-network:
        aliases:
          - trade-engine
    profiles:
      - prod

  # ── signal-gateway (agent → trade-engine) ──

  signal-gateway:
    <<: *service-defaults
    profiles:
      - dev
    build:
      context: .
      dockerfile: process/signal_gateway/Dockerfile
      target: dev-builder
    command: cargo run -p signal-gateway
    volumes:
      - .:/app
      - /app/target
    env_file:
      - .env
    depends_on:
      - trade-engine
      - opencode
    networks:
      - app-network
      - ai-network

  signal-gateway-prod:
    <<: *service-defaults
    cap_drop:
      - ALL
    mem_limit: 1g
    image: ghcr.io/n-choo/coinbot-signal-gateway:latest
    build:
      context: .
      dockerfile: process/signal_gateway/Dockerfile
    env_file:
      - .env
    volumes:
      - signal_gateway_state:/app/state
    depends_on:
      trade-engine-prod:
        condition: service_started
      opencode:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network
      - ai-network
    profiles:
      - prod

  # ── opencode sandbox (AI agent server) ─────
  # Isolated network namespace: host-localhost unreachable from inside,
  # outbound webfetch allowed. External clients hit 127.0.0.1:4096 here.
  # Secrets are runtime-only; never bake them into the image.
  # Only its own env file is loaded so DB/exchange secrets stay out of the sandbox.

  opencode:
    <<: *service-defaults
    cap_drop:
      - ALL
    mem_limit: 2g
    image: ghcr.io/n-choo/coinbot-opencode:latest
    build:
      context: ./process/opencode
    restart: unless-stopped
    ports:
      - "127.0.0.1:4096:4096"
    env_file:
      - path: process/opencode/.env
        required: false
    volumes:
      - opencode_data:/root/.local/share/opencode
      - ./.opencode:/app/.opencode:ro
    networks:
      - ai-network
    profiles:
      - prod
      - tools
      - dev

networks:
  app-network:
    driver: bridge
  # Only signal-gateway and opencode join this network. The AI sandbox has no
  # route to Postgres, Redis, the API gateway, deposit-worker, or trade-engine.
  ai-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  opencode_data:
  signal_gateway_state:
