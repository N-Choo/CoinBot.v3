# ──────────────────────────────────────────────
# Dev services  → local DB, hot-reload, debug
# Prod services → cloud DB, pre-built images
#
# make dev   → starts all dev services
# prod services run via the prod profile / deployed images
# ──────────────────────────────────────────────

services:
  # ── Shared Infrastructure ──────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-coinbot}
    # No host port: only containers on app-network can reach PostgreSQL.
    # `make dev` adds a 127.0.0.1-only mapping via docker-compose.dev.yml.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    # No host port: only containers on app-network can reach Redis.
    # `make dev` adds a 127.0.0.1-only mapping via docker-compose.dev.yml.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  # ── Deposit Worker ─────────────────────────

  deposit-worker:
    profiles:
      - dev
    build:
      context: .
      dockerfile: process/deposit-worker/Dockerfile
      target: dev-builder
    command: cargo run -p deposit
    volumes:
      - .:/app
      - /app/target
    env_file:
      - .env
    environment:
      - RUST_LOG=${RUST_LOG:-info,sqlx=warn,hyper=warn,reqwest=warn,h2=warn,rustls=warn,tonic=warn}
      - "DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coinbot}"
      - "GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:?set GRPC_AUTH_TOKEN in .env}"
    depends_on:
      - postgres
    networks:
      - app-network

  deposit-worker-prod:
    image: ghcr.io/n-choo/coinbot-worker:latest
    build:
      context: .
      dockerfile: process/deposit-worker/Dockerfile
    env_file:
      - .env
    environment:
      - GRPC_ADDR=0.0.0.0:50051
      - RUST_LOG=${RUST_LOG:-info,sqlx=warn,hyper=warn,reqwest=warn,h2=warn,rustls=warn,tonic=warn}
      - "DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coinbot}"
      - "GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:?set GRPC_AUTH_TOKEN in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - prod

  # ── Withdraw Worker ────────────────────────

  withdraw-worker:
    profiles:
      - dev
    build:
      context: .
      dockerfile: process/withdraw-worker/Dockerfile
      target: dev-builder
    command: cargo run -p withdraw-worker
    volumes:
      - .:/app
      - /app/target
    env_file:
      - .env
    environment:
      - RUST_LOG=${RUST_LOG:-info,sqlx=warn,hyper=warn,reqwest=warn,h2=warn,rustls=warn,tonic=warn}
      - "DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coinbot}"
      - "GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:?set GRPC_AUTH_TOKEN in .env}"
    depends_on:
      - postgres
    networks:
      - app-network

  withdraw-worker-prod:
    image: ghcr.io/n-choo/coinbot-withdraw-worker:latest
    build:
      context: .
      dockerfile: process/withdraw-worker/Dockerfile
    env_file:
      - .env
    environment:
      - RUST_LOG=${RUST_LOG:-info,sqlx=warn,hyper=warn,reqwest=warn,h2=warn,rustls=warn,tonic=warn}
      - "DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coinbot}"
      - "GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:?set GRPC_AUTH_TOKEN in .env}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - prod

  # ── API Gateway ────────────────────────────

  api_gateway:
    profiles:
      - dev
    build:
      context: .
      dockerfile: process/api_gateway/Dockerfile
      target: dev-builder
    command: cargo run -p api-gateway
    env_file:
      - .env
    ports:
      - "8081:8080"
    volumes:
      - .:/app
      - /app/target
    environment:
      - RUST_LOG=${RUST_LOG:-info,sqlx=warn,hyper=warn,reqwest=warn,h2=warn,rustls=warn,tonic=warn}
      - GRPC_DEPOSIT_ENDPOINT=http://deposit-worker:50051
      - "DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coinbot}"
      - "GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:?set GRPC_AUTH_TOKEN in .env}"
      - "REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379"
      - API_GATEWAY_ALLOWED_ORIGIN=http://localhost:5173
    depends_on:
      - postgres
      - redis
      - deposit-worker
    networks:
      - app-network

  api_gateway-prod:
    image: ghcr.io/n-choo/coinbot-api_gateway:latest
    build:
      context: .
      dockerfile: process/api_gateway/Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=${RUST_LOG:-info,sqlx=warn,hyper=warn,reqwest=warn,h2=warn,rustls=warn,tonic=warn}
      - GRPC_DEPOSIT_ENDPOINT=http://deposit-worker-prod:50051
      - "DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coinbot}"
      - "GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:?set GRPC_AUTH_TOKEN in .env}"
      - "REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      deposit-worker-prod:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - prod

  # ── Frontend ───────────────────────────────

  frontend:
    profiles:
      - dev
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./react:/app:Z
      - /app/node_modules
    depends_on:
      - api_gateway
    networks:
      - app-network
    environment:
      - VITE_BACKEND_URL=http://api_gateway:8080

  frontend-prod:
    image: ghcr.io/n-choo/coinbot-frontend:latest
    build:
      context: ./react
    ports:
      - "80:80"
    depends_on:
      - api_gateway-prod
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - prod

  # ── Trade Engine ───────────────────────────

  trade-engine:
    profiles:
      - dev
    build:
      context: .
      dockerfile: process/trade-engine/Dockerfile
      target: dev-builder
    command: cargo run -p trade-engine
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - .:/app
      - /app/target
    env_file:
      - .env
    environment:
      - RUST_LOG=${RUST_LOG:-info,sqlx=warn,hyper=warn,reqwest=warn,h2=warn,rustls=warn,tonic=warn}
      - "DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coinbot}"
      - "GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:?set GRPC_AUTH_TOKEN in .env}"
    depends_on:
      - postgres
      - redis
      - deposit-worker
    networks:
      - app-network

  trade-engine-prod:
    image: ghcr.io/n-choo/coinbot-trade_engine:latest
    build:
      context: .
      dockerfile: process/trade-engine/Dockerfile
    env_file:
      - .env
    environment:
      - RUST_LOG=${RUST_LOG:-info,sqlx=warn,hyper=warn,reqwest=warn,h2=warn,rustls=warn,tonic=warn}
      - "DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-coinbot}"
      - "GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:?set GRPC_AUTH_TOKEN in .env}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - prod

  # ── signal-gateway (agent → trade-engine) ──

  signal-gateway:
    profiles:
      - dev
    build:
      context: .
      dockerfile: process/signal_gateway/Dockerfile
      target: dev-builder
    command: cargo run -p signal-gateway
    volumes:
      - .:/app
      - /app/target
    env_file:
      - .env
    environment:
      - RUST_LOG=${RUST_LOG:-info,sqlx=warn,hyper=warn,reqwest=warn,h2=warn,rustls=warn,tonic=warn}
      - OPENCODE_BASE_URL=http://opencode:4096
      - "OPENCODE_PASSWORD=${OPENCODE_PASSWORD:?set OPENCODE_PASSWORD in .env}"
      - "GRPC_AUTH_TOKEN=${GRPC_AUTH_TOKEN:?set GRPC_AUTH_TOKEN in .env}"
      - OPENCODE_AGENT=trade-agent
      - OPENCODE_MODEL=${OPENCODE_MODEL:-opencode-go/deepseek-v4.1-flash}
      - GRPC_TRADE_ENGINE_ENDPOINT=http://trade-engine:50051
      - SIGNAL_GATEWAY_RUN_ON_START=${SIGNAL_GATEWAY_RUN_ON_START:-false}
      - SIGNAL_GATEWAY_DELETE_SESSIONS=${SIGNAL_GATEWAY_DELETE_SESSIONS:-true}
      - SIGNAL_GATEWAY_PRICE_CHECK=${SIGNAL_GATEWAY_PRICE_CHECK:-strict}
      - SIGNAL_GATEWAY_RESET_STATE=${SIGNAL_GATEWAY_RESET_STATE:-false}
      - SIGNAL_GATEWAY_STATE_PATH=./state/signal_gateway.json
      - SIGNAL_GATEWAY_AUDIT_PATH=./state/audit.jsonl
    depends_on:
      - trade-engine
      - opencode
    networks:
      - app-network
      - ai-network

  # ── opencode sandbox (AI agent server) ─────
  # Isolated network namespace: host-localhost unreachable from inside,
  # outbound webfetch allowed. External clients hit 127.0.0.1:4096 here.
  # Secrets are runtime-only; never bake them into the image.

  opencode:
    image: ghcr.io/n-choo/coinbot-opencode:latest
    build:
      context: ./process/opencode
    restart: unless-stopped
    ports:
      - "127.0.0.1:4096:4096"
    env_file:
      - path: process/opencode/.env
        required: false
    environment:
      - "OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD in .env}"
    volumes:
      - opencode_data:/root/.local/share/opencode
      - ./.opencode:/app/.opencode:ro
    networks:
      - ai-network
    profiles:
      - tools
      - dev

networks:
  app-network:
    driver: bridge
  # Only signal-gateway and opencode join this network. The AI sandbox has no
  # route to Postgres, Redis, the API gateway, deposit-worker, or trade-engine.
  ai-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  opencode_data:
