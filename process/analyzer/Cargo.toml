[package]
name = "analyzer"
version = "0.1.0"
edition = "2021"

[features]
default = []
exchange = ["dep:ureq", "dep:serde_json", "dep:chrono"]
live = ["exchange", "dep:tokio", "dep:chrono"]
grpc = ["live", "dep:tonic", "dep:prost"]
harness = ["exchange", "dep:clap", "dep:csv"]

[dependencies]
share = { path = "../../lib/share" }
log.workspace = true
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ureq = { version = "2", features = ["json"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"], optional = true }
chrono = { workspace = true, optional = true }
sha2 = "0.10"
dotenvy = { workspace = true }
clap = { version = "4", features = ["derive"], optional = true }
csv = { version = "1", optional = true }
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "analyzer-serve"
path = "src/bin/analyzer-serve.rs"
required-features = ["live", "grpc"]

[[bin]]
name = "analyzer-replay"
path = "src/bin/analyzer-replay.rs"
required-features = ["harness"]

[[bin]]
name = "analyzer-sweep"
path = "src/bin/analyzer-sweep.rs"
required-features = ["harness"]

[[bin]]
name = "analyzer-cost-ladder"
path = "src/bin/analyzer-cost-ladder.rs"
required-features = ["harness"]

[[bin]]
name = "analyzer-execution"
path = "src/bin/analyzer-execution.rs"
required-features = ["harness"]

[dev-dependencies]
serde_json = "1"
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
