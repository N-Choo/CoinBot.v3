syntax = "proto3";
package analyzer;

// One trade signal pushed by the analyzer.
message Signal {
  string ticker = 1;          // KuCoin symbol, e.g. "XRP-USDT"
  string action = 2;          // "BUY" (long) or "SELL" (short)
  double entry_price = 3;     // reference entry price (core signal)
  uint32 schema_version = 4;  // payload schema version
  string signal_id = 5;       // stable id; the engine's dedup key
  uint64 seq = 6;             // global monotonic counter, assigned at emission
  int64 expires_at_ms = 7;    // emission time + TTL; the engine ignores a signal after this.
  int64 trigger_time_ms = 8;  // touching-tick time — the strategy event time
  reserved 9, 10;
  string zone_id = 11;        // currently always empty
  string reason = 12;         // e.g. "rsi_long_cross" or "rsi_short_cross"
}

message Empty {}
message Symbols { repeated string tickers = 1; }
message Ack {
  bool accepted = 1; // false = received but rejected (expired / past tolerance / duplicate)
  string reason = 2; // human-readable outcome, for logs
}

// Trade-engine : Server
// analyzer : Client
service EngineService {
  rpc GetActiveSymbols(Empty) returns (Symbols);
  rpc Publish(Signal) returns (Ack);
}
