[package]
name = "analyzer-rs"
version = "0.1.0"
edition = "2021"

[features]
default = []
exchange = ["dep:ureq", "dep:serde_json", "dep:chrono"]
live = ["exchange", "dep:tokio", "dep:chrono", "dep:dotenvy"]
grpc = ["live", "dep:tonic", "dep:prost", "dep:sha2"]

[dependencies]
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ureq = { version = "2", features = ["json"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"], optional = true }
chrono = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
sha2 = { version = "0.10", optional = true }

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "analyzer-serve"
path = "src/bin/analyzer-serve.rs"
required-features = ["live", "grpc"]

[dev-dependencies]
serde_json = "1"
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
