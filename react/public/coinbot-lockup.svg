<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96" fill="none" role="img" aria-label="CoinBot">
  <defs>
    <linearGradient id="cbw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a65"/>
      <stop offset="1" stop-color="#ff5722"/>
    </linearGradient>
    <linearGradient id="cbm" x1="4" y1="12" x2="76" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a65"/>
      <stop offset="1" stop-color="#ff5722"/>
    </linearGradient>
  </defs>

  <!-- mark: gradient brand tile -->
  <rect x="4" y="12" width="72" height="72" rx="19.5" fill="url(#cbm)"/>
  <rect x="14.5" y="22.5" width="51" height="51" rx="10.5" stroke="#fff" stroke-opacity="0.25" stroke-width="3"/>

  <!-- wordmark -->
  <text x="88" y="65" font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="50" font-weight="800" letter-spacing="-1.5" fill="url(#cbw)">CoinBot</text>
