# TLS terminates at the external proxy/load balancer (HTTPS + HSTS belong
# there). This container serves plain HTTP and sets the non-TLS security headers.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Enable after verifying the SPA/TradingView embed still works:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://s3.tradingview.com https://*.tradingview.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.tradingview.com; frame-src https://*.tradingview.com; font-src 'self' data:" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
        # The SPA shell must revalidate so a new deploy isn't hidden by a
        # cached index.html pointing at old (immutable) asset hashes.
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api_gateway-prod:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kucoin-api/ {
        rewrite ^/kucoin-api/(.*)$ /$1 break;
        proxy_pass https://api.kucoin.com;
        proxy_set_header Host api.kucoin.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /news-api/ {
        rewrite ^/news-api/(.*)$ /$1 break;
        proxy_pass https://cointelegraph.com;
        proxy_set_header Host cointelegraph.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
