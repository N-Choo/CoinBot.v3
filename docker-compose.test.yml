# Test-only overrides for `make test`.
#
# Forces dedicated test credentials (read from .env.ci via --env-file) so the
# test database never depends on, or matches, the developer's root .env.
# `environment` takes precedence over the base `env_file: .env`.

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
