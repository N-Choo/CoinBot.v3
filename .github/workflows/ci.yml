name: Full-Stack CI

on:
  push:
    branches: [main, "feature/**", "FEAT/**", "feat/**", "fix/**", "chore/**", "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: Rebuild and push all images
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # --- Detect which service images need rebuilding ---
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            api_gateway:
              - 'process/api_gateway/**'
              - 'lib/share/**'
              - 'process/proto/**'
              - 'process/migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.dockerignore'
            deposit_worker:
              - 'process/deposit-worker/**'
              - 'lib/share/**'
              - 'process/proto/**'
              - 'process/migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.dockerignore'
            withdraw_worker:
              - 'process/withdraw-worker/**'
              - 'lib/share/**'
              - 'process/proto/**'
              - 'process/migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.dockerignore'
            trade_engine:
              - 'process/trade-engine/**'
              - 'lib/share/**'
              - 'process/proto/**'
              - 'process/migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.dockerignore'
            signal_gateway:
              - 'process/signal_gateway/**'
              - 'lib/share/**'
              - 'process/proto/**'
              - 'process/migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.dockerignore'
            opencode:
              - 'process/opencode/**'
              - '.dockerignore'
            frontend:
              - 'react/**'
      - name: Build image matrix
        id: matrix
        env:
          BUILD_ALL: ${{ inputs.build_all }}
          API_GATEWAY: ${{ steps.filter.outputs.api_gateway }}
          DEPOSIT_WORKER: ${{ steps.filter.outputs.deposit_worker }}
          WITHDRAW_WORKER: ${{ steps.filter.outputs.withdraw_worker }}
          TRADE_ENGINE: ${{ steps.filter.outputs.trade_engine }}
          SIGNAL_GATEWAY: ${{ steps.filter.outputs.signal_gateway }}
          OPENCODE: ${{ steps.filter.outputs.opencode }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          set -euo pipefail
          images='[]'
          add() { images=$(jq -c --argjson img "$1" '. + [$img]' <<<"$images"); }
          changed() { [ "${BUILD_ALL:-false}" = "true" ] || [ "$1" = "true" ]; }

          if changed "$API_GATEWAY"; then
            add '{"name":"api_gateway","context":".","file":"process/api_gateway/Dockerfile","image":"coinbot-api_gateway"}'
          fi
          if changed "$DEPOSIT_WORKER"; then
            add '{"name":"deposit-worker","context":".","file":"process/deposit-worker/Dockerfile","image":"coinbot-worker"}'
          fi
          if changed "$WITHDRAW_WORKER"; then
            add '{"name":"withdraw-worker","context":".","file":"process/withdraw-worker/Dockerfile","image":"coinbot-withdraw-worker"}'
          fi
          if changed "$TRADE_ENGINE"; then
            add '{"name":"trade-engine","context":".","file":"process/trade-engine/Dockerfile","image":"coinbot-trade_engine"}'
          fi
          if changed "$SIGNAL_GATEWAY"; then
            add '{"name":"signal-gateway","context":".","file":"process/signal_gateway/Dockerfile","image":"coinbot-signal-gateway"}'
          fi
          if changed "$OPENCODE"; then
            add '{"name":"opencode","context":"./process/opencode","file":"./process/opencode/Dockerfile","image":"coinbot-opencode"}'
          fi
          if changed "$FRONTEND"; then
            add '{"name":"frontend","context":"./react","file":"./react/Dockerfile","image":"coinbot-frontend"}'
          fi

          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Image matrix: $images"

  # --- Compose validation (runs on every push/PR) ---
  validate:
    name: Validate compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare CI environment
        run: cp .env.ci .env
      - name: Base config
        run: docker compose config --quiet
      - name: Dev config
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Prod config
        run: docker compose --profile prod --profile tools config --quiet
      - name: Prod config (pinned)
        run: docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.prod.yml --profile prod --profile tools config --quiet
      - name: Test config
        run: docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.test.yml config --quiet

  # --- Tests ---
  backend-test:
    uses: ./.github/workflows/_backend-test.yml

  frontend-test:
    uses: ./.github/workflows/_frontend-test.yml

  # --- API smoke test (main only) ---
  smoke-test:
    uses: ./.github/workflows/_smoke-test.yml
    needs: [validate, backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'

  # --- Build & push changed images (main only) ---
  push-arm:
    uses: ./.github/workflows/_images.yml
    needs: [changes, validate, backend-test, frontend-test, smoke-test]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.images != '[]'
    permissions:
      contents: read
      packages: write
    with:
      images: ${{ needs.changes.outputs.images }}
