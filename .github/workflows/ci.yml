name: Full-Stack CI

on:
  push:
    branches: [main, "feature/**", "FEAT/**"]
  pull_request:
    branches: [main]

jobs:
  # --- Backend Checks ---
  # The Rust matrix is an **architecture** matrix (x86_64 vs arm64), not an OS matrix: it exists
  # so the cross-platform golden-hash check (replay_equivalence) compares on both architectures.
  backend-test:
    name: Rust (Server, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
      - name: Check Format
        run: make fmt
      - name: Clippy (Linter)
        run: make clippy
      - name: Strategy core purity + feature builds
        run: make strategy-check
      - name: Strategy golden hash (cross-platform)
        run: cargo test -p strategy-analyzer --features harness --test replay_equivalence
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: process/analyzer/requirements.txt
      - name: Install analyzer test deps
        run: pip install -r process/analyzer/requirements.txt pytest
      - name: Run Tests
        run: make test

  # --- Frontend Checks ---
  frontend-test:
    name: React (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: react/package-lock.json
      - name: Install Dependencies
        run: cd react && npm ci
      - name: Lint
        run: cd react && npm run lint
      - name: Test
        run: cd react && npm run test
      - name: Type Check & Build
        run: cd react && npm run build

  # --- Push ARM64 images to registry (main only) ---
  push-arm:
    name: Build & Push ARM64
    needs: [backend-test, frontend-test, smoke-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Lowercase registry owner
        id: registry
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT
      - name: Build & push api_gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: process/api_gateway/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/coinbot-api_gateway:latest
      - name: Build & push deposit-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: process/deposit-worker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/coinbot-worker:latest
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./react
          file: ./react/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/coinbot-frontend:latest
      - name: Build & push analyzer
        uses: docker/build-push-action@v5
        with:
          context: ./process/analyzer
          file: ./process/analyzer/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/coinbot-analyzer:latest
      - name: Build & push trade-engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: process/trade-engine/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/coinbot-trade_engine:latest

  # --- Full-stack smoke test (main only) ---
  smoke-test:
    name: Smoke Test
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: make prod-build
      - name: Start services
        run: |
          cp .env.ci .env
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile prod up -d
      - name: Wait for api_gateway
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8080/api/config; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Backend failed to start within 60 seconds"
          exit 1
      - name: Run smoke tests
        run: BASE_URL=http://localhost:8080 make test-api
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down
