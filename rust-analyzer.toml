# Editor-agnostic rust-analyzer configuration (rust-analyzer reads this file from the
# workspace root, whatever editor you use). Keeps the workspace in sync with the crate's
# feature-gated modules so they analyze without "unresolved"/cfg errors.
#
# strategy-analyzer is `default = []` with `harness` and `live` modules behind
# #[cfg(feature = ...)], and its `backtest`/`serve` bins are `required-features`.
# Enable them here so rust-analyzer checks the whole crate.
[check]
command = "clippy"

[cargo]
features = ["harness", "live"]
